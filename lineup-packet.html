<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line-Up Packet | Puff 'n Stuff</title>

<style>
/* Line-Up Packet: Production SEO in, supervisor box packet out (line-up sheet + one block per station).
   Tool chrome follows the Proposal Builder; the printed pages follow the reception team's Line Up Sheet. */
@font-face{font-family:"Cormorant";font-weight:600;src:url("proposal-builder/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Cormorant";font-weight:500;src:url("proposal-builder/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:400;src:url("proposal-builder/fonts/lato-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:400;font-style:italic;src:url("proposal-builder/fonts/lato-latin-400-italic.woff2") format("woff2")}
@font-face{font-family:"Lato";font-weight:700;src:url("proposal-builder/fonts/lato-latin-700-normal.woff2") format("woff2")}
:root{--mr:#202020;--vc:#FEFFF9;--ps:#E8E8E6;--sc:#424242;--mute:#76766f;--line:#cfcfca}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#f4f4f1;color:var(--mr);font-family:"Lato",system-ui,sans-serif;font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
#app header{background:var(--mr);color:var(--vc);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#app header .logo{height:30px;filter:invert(1)}
#app header h1{font-family:"Cormorant",serif;font-weight:500;font-size:25px;margin:0;padding-left:16px;border-left:1px solid rgba(254,255,249,.25)}
#app header .hsub{color:#bdbdbb;font-size:12px}
#app header .sp{flex:1}
#app header button{background:transparent;color:var(--vc);border:1px solid rgba(254,255,249,.45);border-radius:2px;padding:9px 16px;cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:40px}
#app header button.solid{background:var(--vc);color:var(--mr)}
#app header button:disabled{opacity:.6;cursor:wait}
#start{max-width:720px;margin:48px auto;padding:0 20px}
#drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:56px 24px;background:#fff;border:1.5px dashed #9a9a94;cursor:pointer;text-align:center}
#drop.hot{border-color:var(--mr);background:#fafaf7}
#drop b{font-family:"Cormorant",serif;font-size:28px;font-weight:600}
#drop span{color:var(--mute)}
#drop input{position:absolute;opacity:0;width:1px;height:1px}
.help{color:var(--sc);line-height:1.6;font-size:15px}
#err{color:#a12a1e;font-weight:700}
#work{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);min-height:calc(100vh - 56px)}
#ed{background:#fff;border-right:1px solid var(--ps);padding:18px;overflow:auto;max-height:calc(100vh - 56px)}
#pv{padding:20px;overflow:auto;max-height:calc(100vh - 56px)}
@media(max-width:900px){#work{grid-template-columns:1fr}#ed,#pv{max-height:none}}
.ed-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px;font-weight:700}
.ed-h:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.fld input{font-size:15px;color:var(--mr);padding:7px 9px;border:1px solid var(--line);border-radius:2px;min-height:38px}
.fld.wide{grid-column:1/-1}
.eb{border:1px solid var(--line);border-radius:3px;padding:10px;margin-bottom:10px;background:#fff}
.eb.off{opacity:.55;background:#fafaf8}
.eb-top{display:flex;gap:6px;align-items:center}
.eb-top input[type=text]{border:1px solid var(--line);border-radius:2px;padding:6px 8px;min-height:36px;font-size:15px}
.eb-title{flex:1;font-weight:700}
.eb-time{width:118px}
.eb input[type=checkbox]{width:18px;height:18px;accent-color:var(--mr)}
.eb-btns{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 4px}
.eb-btns button,#addblock{background:#fff;border:1px solid var(--line);border-radius:2px;padding:5px 9px;font-size:12px;cursor:pointer;min-height:32px}
.eb-btns button:hover,#addblock:hover{border-color:var(--mr)}
.eb-sub{font-size:12px;color:var(--mute);margin:4px 0 0 26px}
.eb-items{margin:6px 0;display:flex;flex-direction:column;gap:3px}
.pi{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0}
.pi img,.pi .noimg{width:44px;height:30px;object-fit:cover;border-radius:2px;background:var(--ps);flex:none}
.pi .noimg{display:inline-block}
.pi small{color:#9a5a00}
.pi.nop{color:var(--mute)}
.eb details{font-size:13px;margin:6px 0}
.eb summary{cursor:pointer;color:var(--sc)}
.eb details label{display:flex;gap:6px;align-items:center;padding:2px 0}

.tip{font-size:12px;color:var(--mute);line-height:1.5}
#scale{transform-origin:top left}
#app header a.hl{color:#d8d8d4;font-size:13px}

.steps li{counter-increment:st;background:#fff;border:1px solid var(--ps);padding:14px 14px 16px;font-size:14.5px;line-height:1.45;color:var(--sc)}

@media(max-width:640px){.steps{grid-template-columns:1fr}}
#go{display:block;width:100%;background:var(--mr);color:var(--vc);border:0;border-radius:3px;padding:18px 16px;font-size:21px;font-weight:700;cursor:pointer;min-height:72px}

#go:disabled{opacity:.75;cursor:wait}
#after{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--sc)}
#after a{color:var(--mr);font-weight:700}
.pk{border:1px solid var(--line);border-radius:3px;padding:11px 12px;margin-top:10px;background:#fff}
.pk-n{font-weight:700;font-size:15.5px;line-height:1.25}
.pk-m{font-size:12.5px;color:var(--mute);margin-top:2px}
.pk .ok{font-size:13px;color:#2f6b3a;margin-top:7px}
.pk ul{margin:7px 0 0;padding:0;list-style:none}

.pk .inf{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.4}
.pk-b{display:flex;gap:6px;margin-top:9px}
.pk-b button,#back,.more{background:#fff;border:1px solid var(--line);border-radius:2px;padding:6px 11px;font-size:13px;cursor:pointer;min-height:36px}
.pk-b button:hover,#back:hover,.more:hover{border-color:var(--mr)}
.bad{border:1px solid #d9a39c;background:#fdf1ef;border-radius:3px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.45;color:#5c1b13}
.bad b{display:block;word-break:break-word}
.more{display:block;text-align:center;margin-top:12px;padding:10px;position:relative}
.more input{position:absolute;opacity:0;width:1px;height:1px}
#back{margin-bottom:14px;font-weight:700}
#busy{color:var(--sc);font-size:15px;margin-top:14px}
.pk-sep{width:816px;margin:6px auto 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
/* ---------- printed pages (8.5 x 11 in at 96 px/in) ---------- */
.page{width:816px;height:1056px;background:#fff;position:relative;overflow:hidden;margin:0 auto 22px;box-shadow:0 1px 6px rgba(0,0,0,.12);color:#1d1d1b}
.pin{position:absolute;left:44px;right:44px;top:40px;bottom:58px}
.pfoot{position:absolute;left:44px;right:44px;bottom:22px;display:flex;justify-content:space-between;font-size:10px;color:#8a8a84;letter-spacing:.04em}

#sizer{position:absolute;left:-12000px;top:0;width:816px;visibility:hidden}
#sizer .page{height:auto;min-height:0;overflow:visible}

  @page{size:letter;margin:0}
  html,body{background:#fff}
  #app header,#ed,#start,#sizer{display:none!important}
  #work{display:block}
  #pv{padding:0;overflow:visible;max-height:none}
  #scale{transform:none!important;height:auto!important}
  .page{margin:0;box-shadow:none;page-break-after:always;break-after:page}
}

<body>
<div id="app">
  <header>
    <img class="logo" src="proposal-builder/logo.png" alt="Puff 'n Stuff">
    <h1>Line-Up Packet</h1>
    <span class="sp"></span>
    <a class="hl" href="lineup-packet-help.html" target="_blank" rel="noopener">How it works</a>
    <button id="restart" hidden>Start over</button>
  </header>
  <section id="start">
    <ol class="steps">
      <li><b>Save the SEOs.</b> Save each of tomorrow's Production SEOs from Caterease as a PDF.</li>
      <li><b>Drop them all here.</b> Every event at once is fine. They stay on this computer.</li>
      <li><b>Press Print.</b> One packet per event comes out, in order of event time.</li>
    </ol>
    <label id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf" multiple>
      <b>Drop tomorrow's SEOs here</b>
      <span>or click to choose them. You can pick several at once.</span>
    </label>
    <p id="busy" hidden></p>
    <div id="startbad"></div>
  </section>
  <section id="work" hidden>
    <aside id="ed"></aside>
    <main id="pv"><div id="scale"><div id="out"></div></div></main>
  </section>
</div>
<div id="sizer"></div>

<script>
window.LP_KEEP_INCLUDED = true;
// SEO reading and Lookbook matching, copied from proposal-builder.html (SEO_LINES, SEO_PARSE, PHOTOS). Keep in step with it.
// Shared by the browser tool and the Node test harness.
// Turns a pdf.js document into visual rows that carry position and type style,
// because Caterease styles each kind of line consistently:
//   section header  semibold/bold face, >= 11.2pt (package titles are a script face, ~35pt)
//   dish name       Lato Bold ~10.8pt at the item indent
//   description     Lato regular ~10.8pt at the item indent
//   diet tags       Lato Bold ~7.9pt
//   qty item        Helvetica "(75) Name" at the left margin
//   select note     Lato regular ~9.7pt, centered
//   page header / footer: Helvetica at the far right / Futura at the bottom
(function (root) {
  // A family name from a TrueType font's name table (full name, else family)
  function ttName(u) {
    const v = new DataView(u.buffer, u.byteOffset, u.byteLength);
    const n = v.getUint16(4);
    let off = -1;
    for (let i = 0; i < n; i++) { const r = 12 + i * 16; if (String.fromCharCode(u[r], u[r + 1], u[r + 2], u[r + 3]) === "name") { off = v.getUint32(r + 8); break; } }
    if (off < 0) return "";
    const cnt = v.getUint16(off + 2), so = off + v.getUint16(off + 4);
    let fam = "";
    for (let i = 0; i < cnt; i++) {
      const r = off + 6 + i * 12, pid = v.getUint16(r), nid = v.getUint16(r + 6), len = v.getUint16(r + 8), o = so + v.getUint16(r + 10);
      if (nid !== 4 && nid !== 1) continue;
      let s = "";
      if (pid === 3 || pid === 0) for (let k = 0; k + 1 < len; k += 2) s += String.fromCharCode(v.getUint16(o + k));
      else for (let k = 0; k < len; k++) s += String.fromCharCode(u[o + k]);
      if (nid === 4 && s) return s;
      if (!fam) fam = s;
    }
    return fam;
  }
  async function inflate(bytes) {
    const ds = new DecompressionStream("deflate");
    const out = new Response(new Blob([bytes]).stream().pipeThrough(ds));
    return new Uint8Array(await out.arrayBuffer());
  }
  // "Microsoft Print to PDF" renames every font CIDFont+F1, F2...; the real names (Lato Bold, Arial)
  // are still inside the embedded font files, so read them from the raw PDF.
  async function printedFontNames(pdf) {
    const map = {};
    try {
      if (typeof DecompressionStream === "undefined") return map;
      const raw = await pdf.getData();
      let txt = "";
      for (let i = 0; i < raw.length; i += 65536) txt += String.fromCharCode.apply(null, raw.subarray(i, i + 65536));
      // pair each descriptor's FontName with its FontFile2, whichever order they're written in
      const descs = txt.match(/\/FontDescriptor\s*<<[\s\S]*?>>/g) || [];
      for (const d of descs) {
        const fn = d.match(/\/FontName\s*\/(CIDFont\+F\d+)/), ff = d.match(/\/FontFile2\s+(\d+)\s+0\s+R/);
        if (!fn || !ff || map[fn[1]]) continue;
        const at = txt.search(new RegExp("(^|[^0-9])" + ff[1] + "\\s+0\\s+obj"));
        if (at < 0) continue;
        const s0 = txt.indexOf("stream", at), e0 = txt.indexOf("endstream", s0);
        if (s0 < 0 || e0 < 0) continue;
        let a = s0 + 6;
        if (txt[a] === "\r") a++;
        if (txt[a] === "\n") a++;
        const head = txt.slice(at, s0);
        const lm = head.match(/\/Length\s+(\d+)(?!\s+0\s+R)/);
        let end = lm ? a + +lm[1] : e0;
        while (!lm && end > a && (raw[end - 1] === 10 || raw[end - 1] === 13)) end--;
        try {
          let bytes = raw.subarray(a, end);
          if (/FlateDecode/.test(head)) bytes = await inflate(bytes);
          const nm = ttName(bytes);
          if (nm) map[fn[1]] = nm;
        } catch (e) { if (root.__fontDebug) console.log("FONTERR", fn[1], e.message); }
      }
    } catch (e) { if (root.__fontDebug) console.log('FONTERR', e); }
    return map;
  }
  async function extractRows(pdf) {
    const rows = [];
    let printed = null;
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      // loading the operator list makes pdf.js resolve the fonts so we can read their real names
      try { await page.getOperatorList(); } catch (e) {}
      const fontName = {};
      const nameOf = (id) => {
        if (id in fontName) return fontName[id];
        let n = "";
        try { const f = page.commonObjs.get(id); n = (f && (f.name || f.loadedName)) || ""; } catch (e) {}
        if (!n && tc.styles && tc.styles[id]) n = tc.styles[id].fontFamily || "";
        return (fontName[id] = n);
      };
      const buckets = [];
      for (const it of tc.items) {
        if (!it.str || !it.str.trim()) continue;
        const t = it.transform;
        const y = t[5], x = t[4];
        const size = Math.round(Math.hypot(t[2], t[3]) * 10) / 10;
        let fname = nameOf(it.fontName);
        const cid = fname.match(/CIDFont\+F\d+/);
        if (cid) {
          if (!printed) printed = await printedFontNames(pdf);
          // Arial stands in for Caterease's Helvetica when the SEO is printed instead of saved
          if (printed[cid[0]]) fname = printed[cid[0]].replace(/^Arial/, "Helvetica").replace(/ Regular$/, "");
        }
        let b = buckets.find((r) => Math.abs(r.y - y) <= 3);
        if (!b) { b = { y, segs: [] }; buckets.push(b); }
        b.segs.push({ x, w: it.width || 0, s: it.str, size, font: fname });
      }
      buckets.sort((a, b) => b.y - a.y);
      for (const b of buckets) {
        b.segs.sort((a, c) => a.x - c.x);
        // join segments; a gap smaller than a fraction of the type size is kerning, not a word break ("Raviol i")
        let text = "";
        b.segs.forEach((sg, k) => {
          if (k === 0) { text = sg.s; return; }
          const prev = b.segs[k - 1];
          const gap = sg.x - (prev.x + prev.w);
          const glue = prev.w && gap < sg.size * 0.12 && /[A-Za-z]$/.test(prev.s) && /^[a-z]/.test(sg.s) ? "" : " ";
          text += glue + sg.s;
        });
        text = text.replace(/\s+/g, " ").trim();
        if (!text) continue;
        const first = b.segs[0];
        const sizes = b.segs.map((s) => s.size);
        // the first segment carries the line's role (a dish name is bold; "Flakes DF" is a regular line with bold tags)
        const bold = /bold|semibold|black|heavy/i.test(first.font);
        rows.push({ page: p, y: b.y, x: first.x, text, size: Math.max(...sizes), font: first.font, bold });
      }

// Notes under the timeline (the event's run of show, set-up notes) and site details (delivery window, unit #)

function equipment(rows) {

let UID = 0;

const CHOICE = /^(vegetarian|vegan|chicken|poultry|beef|pork|lamb|fish|seafood|salmon|duet|duo)( (entr[e\u00e9]e|option|choice|meal|plate))?s?$/i;

function buildBlocks(P, rows, ev) {

async function readOne(file) {

  let pdf;
  const buf = new Uint8Array(await file.arrayBuffer());
  try {
    try { pdf = await pdfjsLib.getDocument({ data: buf.slice() }).promise; }
    catch (werr) { pdfjsLib.GlobalWorkerOptions.workerSrc = ""; pdf = await pdfjsLib.getDocument({ data: buf.slice(), disableWorker: true }).promise; }
  } catch (e) { throw new Error(MSG.open); }
  let meta = {};
  try { meta = (await pdf.getMetadata()).info || {}; } catch (e) {}
  if (/Line-Up Packet/i.test(meta.Creator || "") || /^Line Ups? - /i.test(meta.Title || "")) throw new Error(MSG.packet);
  const rows = await SEO_LINES.extractRows(pdf);
  if (rows.length < 5) throw new Error(MSG.image);
  if (!rows.some((r) => /MENU & INCLUSIONS|SPECIAL EVENT ORDER/.test(r.text))) throw new Error(MSG.notseo);
  const P = SEO_PARSE.parse(rows);

    for (const x of b.stds) if (!up.stds.includes(x)) up.stds.push(x);
    up.extra = clean(up.extra + " " + b.extra); if (!up.time) up.time = b.time;
    BL.splice(i, 1);
  }
  renderEditor(); renderPages();
});

// ---------- printed pages ----------
const val = (v) => (clean(v) ? esc(v) : `<span class="blank"></span>`);
const tg = (t) => (t ? ` <span class="tg">${esc(t)}</span>` : "");
function headHTML() {
  const e = EV;
  const times = [["DEPART", e.depart], ["ARRIVE", e.arrive], ["START", e.start], ["ENDS", e.end], ["BREAKDOWN DONE", e.breakdown]].filter((x) => clean(x[1]));
  return `<div class="ls-title">LINE UP SHEET</div>
  <div class="ls-head"><img class="ls-logo" src="${BASE}proposal-builder/logo.png" alt="Puff 'n Stuff">
   <div class="ls-box"><div><b>DATE:</b> ${val(e.date)}</div><div><b>EVENT:</b> ${val(e.event)}${e.client && e.client !== e.event ? " (" + esc(e.client) + ")" : ""}</div><div><b>SUPERVISOR:</b> ${val(e.supervisor)}</div><div><b>LEAD CHEF:</b> ${val(e.chef)}</div><div><b>GUEST COUNT:</b> ${val(e.guests)}${e.seo ? ` &nbsp; <b>SEO:</b> ${esc(e.seo)}` : ""}</div></div></div>
  <div class="ls-meta">${[e.venue, e.address].filter(clean).map(esc).join(" · ")}${e.contact ? `<br>On-site contact: ${esc(e.contact)}` : ""}${e.service ? ` · ${esc(e.service)}` : ""}</div>
  ${times.length ? `<div class="ls-times">${times.map(([k, v]) => `<span><b>${k}</b>${esc(v)}</span>`).join("")}</div>` : ""}
  ${e.staff.length ? `<div class="ls-meta"><b>Team:</b> ${esc(e.staff.join(", "))}</div>` : ""}
  ${e.alerts.map((a) => `<div class="ls-alert">${esc(a)}</div>`).join("")}
  <div class="ls-menuhead">MENU</div>`;
}
function menuBox(b) {
  return `<div class="mbox"><div class="mb-h">${b.time ? esc(b.time) + " - " : ""}${esc(b.title)}${b.sub ? `<span class="t">${esc(b.sub)}</span>` : ""}</div><ul>${b.items.map((it) =>
    it.head ? `<li class="alt"><b>${esc(it.name)}</b></li>`
    : it.alt ? `<li class="alt">or <b>${esc(it.name)}</b>${it.desc ? ": " + esc(it.desc) : ""}${tg(it.tags)}</li>`
    : `<li><b>${esc(it.name)}${it.desc ? ":" : ""}</b> ${esc(it.desc)}${tg(it.tags)}</li>`).join("")}${b.items.length ? "" : b.inclusions.map((x) => `<li class="inc">${esc(x)}</li>`).join("")}</ul></div>`;
}
function notesBox() {
  const n = EV.notes;
  const eq = EV.equipment || [];
  if (!n.length && !eq.length) return "";
  return `<div class="nbox">${n.length ? `<h4>EVENT NOTES</h4><div class="nl">${n.map((t) => `<div>${esc(t)}</div>`).join("")}</div>` : ""}${eq.length ? `<h4 style="margin-top:${n.length ? 6 : 0}px">EQUIPMENT</h4><div class="nl">${eq.map((t) => `<div>${esc(t)}</div>`).join("")}</div>` : ""}</div>`;
}
function qrSVG(id) {
  const q = qrcode(0, "M"); q.addData(STD_URL + id); q.make();
  return q.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
}
function cardHTML(b, maxPhotos) {
  const photos = [];
  for (const it of b.items) if (it.photo && it.photo.on && !photos.some((p) => p.slug === it.photo.slug)) photos.push({ slug: it.photo.slug, name: it.name });
  const shown = photos.slice(0, maxPhotos);
  const info = [];
  if (b.inclusions.length) info.push(["SETUP", b.inclusions.join(" ")]);
  if (b.equipment.length) info.push(["EQUIPMENT", b.equipment.join(", ")]);
  const notes = b.notes.concat(clean(b.extra) ? [b.extra] : []);
  if (notes.length) info.push(["NOTES", notes.join(" ")]);
  return `<div class="card">
   <div class="c-h"><div>${b.time ? `<div class="c-time">${esc(b.time)}</div>` : ""}<div class="c-title">${esc(b.title)}</div>${b.sub ? `<div class="c-sub">${esc(b.sub)}</div>` : ""}</div>
    ${b.stds.length ? `<div class="c-qrs">${b.stds.map((id) => `<div class="c-qr">${qrSVG(id)}Station standard:<br><b>${esc(stdName(id))}</b></div>`).join("")}</div>` : ""}</div>
   ${b.items.length ? `<div class="c-items">${b.items.map((it) => it.head ? `<div class="hd"><b>${esc(it.name)}</b></div>` : `<div class="${it.alt ? "alt" : ""}">${it.qty != null ? `<span class="q">(${it.qty})</span>` : ""}${it.alt ? "or " : ""}${esc(it.name)}${tg(it.tags)}</div>`).join("")}</div>` : ""}
   ${info.map(([k, v]) => `<div class="c-info"><b>${k}</b>${esc(v)}</div>`).join("")}
   ${shown.length ? `<div class="c-photos">${shown.map((p) => `<figure><img src="${esc(photoSrc(p.slug))}" alt="" crossorigin="anonymous"><figcaption>${esc(p.name)}</figcaption></figure>`).join("")}</div>` : ""}
   <div class="c-assign"><div class="a-row">SET UP<i></i></div><div class="a-row">GUEST ARRIVAL<i></i></div><div class="a-row">SERVICE<i></i></div><div class="a-row">BREAKDOWN<i></i></div><div class="a-row w">NOTES<i></i></div></div>
  </div>`;
}

const PAGE_H = 1056 - 40 - 58; // content height inside .pin
function measure(html, width) {
  const s = $("#sizer");
  s.innerHTML = `<div class="page"><div class="pin" style="width:${width || 728}px">${html}</div></div>`;
  return s.querySelector(".pin").firstElementChild ? s.querySelector(".pin").getBoundingClientRect().height : 0;
}
// the pages of the packet EV / BL point at
function pagesFor() {
  const blocks = BL.filter((b) => b.include);
  const pages = [];
  const headH = measure(headHTML());
  const quoteRoom = 26;
  const colW = (728 - 18) / 2;
  const boxes = blocks.map((b) => ({ html: menuBox(b), h: measure(menuBox(b), colW) + 12 }));
  let pg = { head: true, cols: [[], []], ch: [0, 0], avail: PAGE_H - headH - quoteRoom, tail: "" };
  pages.push(pg);
  for (const bx of boxes) {
    const k = pg.ch[0] <= pg.ch[1] ? 0 : 1;
    let put = pg.ch[k] + bx.h <= pg.avail ? k : pg.ch[1 - k] + bx.h <= pg.avail ? 1 - k : -1;
    if (put < 0 && (pg.cols[0].length || pg.cols[1].length)) {
      pg = { head: false, cols: [[], []], ch: [0, 0], avail: PAGE_H - quoteRoom, tail: "" };
      pages.push(pg); put = 0;
    } else if (put < 0) put = k;
    pg.cols[put].push(bx.html); pg.ch[put] += bx.h;
  }
  const nb = notesBox();
  if (nb) {
    const nh = measure(nb);
    if (Math.max(pg.ch[0], pg.ch[1]) + nh > pg.avail) { pg = { head: false, cols: [[], []], ch: [0, 0], avail: PAGE_H - quoteRoom, tail: "" }; pages.push(pg); }
    pg.tail = nb;
  }
  const menuPages = pages.map((p) => `${p.head ? headHTML() : `<div class="sp-head"><span class="k">MENU (CONTINUED)</span><span class="e">${esc(EV.event)}</span></div>`}<div class="cols"><div class="col">${p.cols[0].join("")}</div><div class="col">${p.cols[1].join("")}</div></div>${p.tail}`);
  const spHead = `<div class="sp-head"><span class="k">STATION ASSIGNMENTS</span><span class="e">${esc([EV.event, EV.date].filter(clean).join(" · "))}</span></div>`;
  const spH = measure(spHead) + 0;
  const stationPages = [];
  let cur = [], used = spH;
  for (const b of blocks) {
    let max = 8, html = cardHTML(b, max), h = measure(html) + 14;
    while (h > PAGE_H - spH && max > 0) { max -= 4; html = cardHTML(b, Math.max(max, 0)); h = measure(html) + 14; }
    if (used + h > PAGE_H && cur.length) { stationPages.push(cur); cur = []; used = spH; }
    cur.push(html); used += h;
  }
  if (cur.length) stationPages.push(cur);
  const all = menuPages.map((c) => ({ c, quote: true })).concat(stationPages.map((cards) => ({ c: spHead + cards.join(""), quote: false })));
  const n = all.length;
  const foot = (i) => `<div class="pfoot"><span>${esc([EV.seo, EV.event].filter(clean).join(" · "))}</span><span>Page ${i + 1} of ${n}</span></div>`;
  return all.map((p, i) => `<div class="page"><div class="pin">${p.c}</div>${p.quote ? `<div class="quote">${esc(QUOTE)}</div>` : ""}${foot(i)}</div>`);
}
function renderPages() {
  if (!PK.length) return;
  DIRTY = true;
  let html = "";
  PK.forEach((p, i) => {
    EV = p.ev; BL = p.bl;
    const pages = pagesFor();
    p.pages = pages.length;
    html += `<div data-pk="${i}">${PK.length > 1 ? `<div class="pk-sep">${i + 1} of ${PK.length} · ${esc(p.ev.event)}</div>` : ""}${pages.join("")}</div>`;
  });
  if (EDIT >= 0) { EV = PK[EDIT].ev; BL = PK[EDIT].bl; }
  $("#out").innerHTML = html;
  $("#sizer").innerHTML = "";
  fit();
}
function fit() {
  const pv = $("#pv"), sc = $("#scale");
  const k = Math.min(1, (pv.clientWidth - 40) / 816);
  sc.style.transform = `scale(${k})`;
  sc.style.width = "816px";
  sc.style.height = $("#out").scrollHeight * k + "px";
}
window.addEventListener("resize", () => { if (PK.length) fit(); });

// ---------- input ----------
const drop = $("#drop");
$("#file").addEventListener("change", (e) => addFiles(e.target.files));
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("hot"); }));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("hot"); }));
// a drop anywhere on the page counts, before or after the first batch
document.addEventListener("drop", (e) => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
$("#restart").addEventListener("click", () => location.reload());

// ---------- print ----------
// One button: build the PDF, then hand it to the printer. The PDF is built in the page, so an unreachable default printer can't hang the preview.
const safe = (t) => t.replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
const fileName = () => {
  if (PK.length === 1) return safe("Line Up - " + [PK[0].ev.event, PK[0].ev.date].filter(clean).join(" - "));
  const dates = [...new Set(PK.map((p) => p.ev.date).filter(clean))];
  return safe("Line Ups - " + (dates.length === 1 ? dates[0] : dates[0] + " to " + dates[dates.length - 1]) + " (" + PK.length + " events)");
};
const LIBS = [["htmlToImage", "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"], ["jspdf", "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"]];
const loadScript = (src) => new Promise((ok, bad) => { const t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = () => bad(new Error("Couldn't load " + src)); document.head.appendChild(t); });
async function buildPDF(say) {
  for (const [g, src] of LIBS) if (!window[g]) await loadScript(src);
  await document.fonts.ready;
  const pages = [...document.querySelectorAll("#out .page")];
  await Promise.all([...document.querySelectorAll("#out img")].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
  const fontEmbedCSS = await htmlToImage.getFontEmbedCSS(pages[0]);
  const pdf = new jspdf.jsPDF({ unit: "in", format: "letter", orientation: "portrait", compress: true });
  for (let i = 0; i < pages.length; i++) {
    say(`Getting page ${i + 1} of ${pages.length} ready…`);
    const url = await htmlToImage.toJpeg(pages[i], { quality: 0.92, pixelRatio: 2, backgroundColor: "#ffffff", fontEmbedCSS, style: { margin: "0", boxShadow: "none", transform: "none" } });
    if (i) pdf.addPage("letter", "portrait");
    pdf.addImage(url, "JPEG", 0, 0, 8.5, 11, undefined, "FAST");
  }
  pdf.setProperties({ title: fileName(), creator: "Puff 'n Stuff Line-Up Packet" });
  return pdf.output("blob");
}
async function printAll() {
  const btn = $("#go"), label = btn.innerHTML, after = $("#after");
  const chromium = /Chrome\//.test(navigator.userAgent);
  // other browsers can't print a PDF from inside the page, so the packet opens in its own tab (opened now, while the click still allows it)
  const tab = chromium ? null : window.open("", "_blank");
  if (tab) tab.document.write("<p style='font:16px sans-serif;padding:24px'>Getting the packets ready…</p>");
  btn.disabled = true; after.textContent = "";
  try {
    if (DIRTY || !PDF_URL) {
      const blob = await buildPDF((t) => { btn.innerHTML = t; });
      if (PDF_URL) URL.revokeObjectURL(PDF_URL);
      PDF_URL = URL.createObjectURL(blob); DIRTY = false;
    }
    const name = fileName() + ".pdf";
    if (chromium) {
      const old = document.getElementById("printframe"); if (old) old.remove();
      const f = document.createElement("iframe");
      f.id = "printframe"; f.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;visibility:hidden";
      f.onload = () => setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { console.warn(e); } }, 500);
      f.src = PDF_URL; document.body.appendChild(f);
    } else if (tab) tab.location = PDF_URL;
    after.innerHTML = `${tab ? "The packets opened in a new tab. Print from there." : "The print window is opening."} If it doesn't, <a href="${PDF_URL}" target="_blank" rel="noopener">open the packets</a> or <a href="${PDF_URL}" download="${esc(name)}" id="savepdf">save them as a file</a>.`;
  } catch (err) {
    console.error(err);
    if (tab) tab.close();
    after.textContent = "The packets couldn't be made (" + (err && err.message ? err.message : err) + "). Check the internet connection and press Print again.";
  } finally { btn.innerHTML = label; btn.disabled = false; }
}
}
</script>
</body>
</html>
