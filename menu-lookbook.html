<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Photo Lookbook | Puff 'n Stuff</title>
<style>
:root{--wine:#7a1e2d;--gold:#b08d57;--ink:#2b2622;--soft:#8a817a;--line:#e5e0d8;--bg:#faf7f2;--panel:#fffdfa;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px 12px}
.hrow{max-width:1240px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;margin:0;color:var(--wine)}
.sub{color:var(--soft);font-size:.86rem;margin:3px 0 0}
.controls{max-width:1240px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input{padding:8px 13px;border:1px solid var(--line);border-radius:20px;font-size:14px;min-width:230px;flex:0 1 300px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--wine);color:#fff}
.jump{padding:7px 10px;border:1px solid var(--line);border-radius:20px;font-size:13px;background:#fff;color:var(--ink)}
.audit-btn{margin-left:auto;border:1px dashed #c9b9a6;background:none;color:var(--soft);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}
.audit-btn.on{border-style:solid;border-color:var(--gold);background:#f6efe3;color:#6b5330}
.auditbar{max-width:1240px;margin:10px auto 0;display:none;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:#f6efe3;border:1px solid #e8dcc6;border-radius:10px;padding:8px 12px}
body.audit .auditbar{display:flex}
.auditbar .tally{color:#6b5330;margin-right:auto}
.auditbar button{border:1px solid #d9c7a6;background:#fff;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer}
.auditbar button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
main{max-width:1240px;margin:0 auto;padding:10px 20px 120px}
.menu-title{font-family:Georgia,serif;color:var(--wine);font-size:1.35rem;margin:28px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.band{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px;padding:8px 12px;background:#f3ece2;border-radius:10px;font-family:Georgia,serif;font-size:1.05rem;color:var(--wine)}
.band em{font-style:normal;font-family:'Segoe UI',sans-serif;font-size:.76rem;color:var(--soft)}
h3.sec{font-size:.98rem;margin:16px 0 10px;font-weight:700}
h3.sec .cnt{font-weight:400;color:var(--soft);font-size:.76rem;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s}
.card.sel{border-color:var(--wine);box-shadow:0 0 0 2px var(--wine)}
.card.s-none{border-style:dashed;border-color:#d8b8a0;background:#fdf7f2}
.card.s-standin{border-color:#e2cfa2}
.thumb{position:relative;aspect-ratio:3/2;background:#f1ede7;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card.s-none .thumb{cursor:default;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#b79c86;font-size:.78rem;font-weight:600}
.card.s-none .thumb span{font-size:1.5rem}
.tick{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.card.sel .tick{background:var(--wine);color:#fff}
.rib{position:absolute;right:8px;top:8px;background:rgba(176,141,87,.95);color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:10px}
.info{padding:10px 12px 8px;flex:1}
.nm{font-weight:700;font-size:.92rem;line-height:1.2}
.badges{margin:5px 0 5px;display:flex;gap:4px;flex-wrap:wrap}
.diet{font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:8px;background:#efe9df;color:#6b6157}
.d-V{background:#e3f0dd;color:#3f6b32}.d-VEG{background:#eaf2e2;color:#4f6b3a}.d-GF{background:#fdeede;color:#9a6a2a}.d-DF{background:#e6eef5;color:#3f6285}.d-NF{background:#f3e7ef;color:#7a3d6b}
.ds{font-size:.8rem;color:var(--soft);line-height:1.35}
.opts{margin-top:4px;font-size:.74rem;color:var(--soft)}.opts b{color:var(--ink);font-weight:600}
.acts{display:flex;border-top:1px solid var(--line)}
.acts button,.acts a{flex:1;border:0;background:none;padding:7px 4px;font-size:12px;color:var(--wine);cursor:pointer;text-decoration:none;text-align:center;font-family:inherit}
.acts>*+*{border-left:1px solid var(--line)}
.acts button:hover,.acts a:hover{background:#f6efe3}
.hidden{display:none!important}
.empty{padding:40px;text-align:center;color:var(--soft)}
.selbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);transition:transform .2s;z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px;max-width:calc(100% - 24px);flex-wrap:wrap}
.selbar.show{transform:translate(-50%,0)}
.selbar button{border:0;border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.selbar .pri{background:var(--gold);color:#fff;font-weight:600}
.selbar .sec2{background:#4a423c;color:#fff}
.selbar .clr{background:none;color:#cfc6bd;text-decoration:underline}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-150%);transition:transform .2s;background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:40;font-size:13px}
.toast.show{transform:translate(-50%,0)}
.help{max-width:1240px;margin:8px auto 0;font-size:.8rem;color:var(--soft)}
footer{text-align:center;color:var(--soft);font-size:.76rem;padding:10px 20px 30px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>Menu Photo Lookbook</h1>
      <p class="sub">Core &amp; Holiday menus. Tap photos to select them, then download for your proposal.</p>
    </div>
  </div>
  <div class="controls">
    <input id="q" type="search" placeholder="Search dishes or ingredients…" oninput="render()">
    <div class="seg" id="menuSeg">
      <button data-v="all" class="on">All</button><button data-v="Core">Core</button><button data-v="Holiday">Holiday</button>
    </div>
    <select class="jump" id="jump" onchange="jumpTo(this.value)"><option value="">Jump to section…</option></select>
    <button class="audit-btn" id="auditBtn" onclick="toggleAudit()">Photo audit</button>
  </div>
  <div class="auditbar">
    <span class="tally" id="tally"></span>
    <button data-a="all" class="on">All items</button>
    <button data-a="gaps">Needs photo (incl. stand-ins)</button>
    <button data-a="none">No photo at all</button>
    <button onclick="shootList()">Download shoot list (.csv)</button>
  </div>
</header>
<main id="main"></main>
<footer>Photos are sized for proposals and Canva. Same photo library as the SEO to CSV Converter, so new photos show up in both.</footer>
<div class="selbar" id="selbar">
  <span id="selcount"></span>
  <button class="pri" onclick="downloadSelected()">Download photos</button>
  <button class="sec2" onclick="copySelected()">Copy names &amp; descriptions</button>
  <button class="clr" onclick="clearSel()">Clear</button>
</div>
<div class="toast" id="toast"></div>

DATA.forEach((d,i)=>d.i=i);
const DIETN={V:"Vegan",VEG:"Vegetarian",DF:"Dairy-Free",GF:"Gluten-Free",NF:"Nut-Free"};
let MENU="all", AUDIT=location.hash==="#audit", AF="all";
const SEL=new Set();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const diets=g=>[...new Set(String(g).toUpperCase().split(/[,\s]+/).filter(c=>DIETN[c]))];
const fileName=d=>d.n.replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g," ").trim()+".jpg";
const src=d=>"img/menu/"+d.p+".jpg";
const secId=d=>"s-"+(d.m+"-"+d.t+"-"+d.s).toLowerCase().replace(/[^a-z0-9]+/g,"-");

function visible(d,q){
  if(MENU!=="all" && d.m!==MENU) return false;
  if(!AUDIT && d.st!=="own") return false;
  if(AUDIT && AF==="gaps" && d.st==="own") return false;
  if(AUDIT && AF==="none" && d.st!=="none") return false;
  if(q && !(d.n+" "+d.d+" "+d.o+" "+d.s).toLowerCase().includes(q)) return false;
  return true;
}
function card(d){
  const b=diets(d.g).map(c=>`<span class="diet d-${c}" title="${DIETN[c]}">${c}</span>`).join("");
  const opts=d.o?`<div class="opts"><b>Options:</b> ${esc(d.o)}</div>`:"";
  if(d.st==="none"){
    return `<div class="card s-none"><div class="thumb"><span>📷</span>Needs photo</div><div class="info"><div class="nm">${esc(d.n)}</div><div class="badges">${b}</div><div class="ds">${esc(d.d)}</div>${opts}</div><div class="acts"><button onclick="copyOne(${d.i})">Copy text</button></div></div>`;
  }
  const rib=d.st==="standin"?`<span class="rib">Stand-in photo</span>`:"";
  return `<div class="card s-${d.st}${SEL.has(d.i)?" sel":""}" data-i="${d.i}"><div class="thumb" onclick="toggleSel(${d.i})"><img loading="lazy" src="${src(d)}" alt="${esc(d.n)}"><span class="tick">✓</span>${rib}</div><div class="info"><div class="nm">${esc(d.n)}</div><div class="badges">${b}</div><div class="ds">${esc(d.d)}</div>${opts}</div><div class="acts"><a href="${src(d)}" download="${esc(fileName(d))}">Download</a><button onclick="copyOne(${d.i})">Copy text</button></div></div>`;
}
function render(){
  document.body.classList.toggle("audit",AUDIT);
  document.getElementById("auditBtn").classList.toggle("on",AUDIT);
  document.getElementById("auditBtn").textContent=AUDIT?"Exit photo audit":"Photo audit";
  const q=document.getElementById("q").value.trim().toLowerCase();
  const out=[], jumps=[];
  let lastM=null,lastT=null;
  // group preserving order
  const groups=[];
  for(const d of DATA){
    let g=groups[groups.length-1];
    if(!g||g.m!==d.m||g.t!==d.t||g.s!==d.s){g={m:d.m,t:d.t,s:d.s,all:[],vis:[]};groups.push(g);}
    g.all.push(d); if(visible(d,q)) g.vis.push(d);
  }
  for(const g of groups){
    if(!g.vis.length) continue;
    if(g.m!==lastM){out.push(`<div class="menu-title">${g.m} Menu</div>`);lastM=g.m;lastT=null;}
    if(g.t!==lastT && g.t!==g.m){
      const tAll=groups.filter(x=>x.m===g.m&&x.t===g.t).flatMap(x=>x.all);
      const own=tAll.filter(x=>x.st==="own").length;
      out.push(`<div class="band"><span>${esc(g.t)}</span>${AUDIT?`<em>${own}/${tAll.length} photographed</em>`:""}</div>`);lastT=g.t;
    }
    const own=g.all.filter(x=>x.st==="own").length, si=g.all.filter(x=>x.st==="standin").length;
    const cnt=AUDIT?`<span class="cnt">${own}/${g.all.length} photographed${si?` · ${si} stand-in`:""}</span>`:`<span class="cnt">${g.vis.length} photo${g.vis.length>1?"s":""}</span>`;
    const id=secId(g.vis[0]);
    jumps.push(`<option value="${id}">${esc(g.m+" › "+(g.t!==g.m?g.t+" › ":"")+g.s)}</option>`);
    out.push(`<h3 class="sec" id="${id}">${esc(g.s)} ${cnt}</h3><div class="grid">${g.vis.map(card).join("")}</div>`);
  }
  document.getElementById("main").innerHTML=out.join("")||`<div class="empty">No dishes match.</div>`;
  document.getElementById("jump").innerHTML=`<option value="">Jump to section…</option>`+jumps.join("");
  const scope=DATA.filter(d=>MENU==="all"||d.m===MENU);
  const o=scope.filter(d=>d.st==="own").length, s=scope.filter(d=>d.st==="standin").length;
  document.getElementById("tally").textContent=`${o} of ${scope.length} items have their own photo · ${s} using a stand-in · ${scope.length-o-s} with none`;
  updateBar();
}
function jumpTo(id){ if(!id) return; const el=document.getElementById(id); if(el){ const h=document.querySelector("header").offsetHeight; window.scrollTo({top:el.getBoundingClientRect().top+scrollY-h-10,behavior:"smooth"}); } document.getElementById("jump").value=""; }
function toggleSel(i){ SEL.has(i)?SEL.delete(i):SEL.add(i); const c=document.querySelector(`.card[data-i="${i}"]`); if(c) c.classList.toggle("sel",SEL.has(i)); updateBar(); }
function clearSel(){ SEL.clear(); document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel")); updateBar(); }
function updateBar(){ const n=SEL.size; document.getElementById("selcount").textContent=n+" selected"; document.getElementById("selbar").classList.toggle("show",n>0); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function textFor(d){ const g=diets(d.g); return d.n+(g.length?" ("+g.join(", ")+")":"")+(d.d?"\n"+d.d:"")+(d.o?"\nOptions: "+d.o:""); }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy");}catch(_){} ta.remove(); return ok; } }
async function copyOne(i){ if(await copyText(textFor(DATA[i]))) toast("Copied: "+DATA[i].n); }
async function copySelected(){ const t=[...SEL].sort((a,b)=>a-b).map(i=>textFor(DATA[i])).join("\n\n"); if(await copyText(t)) toast("Copied "+SEL.size+" item"+(SEL.size>1?"s":"")); }
function loadZip(){ return window.JSZip?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload=res; s.onerror=()=>rej(new Error("zip library")); document.head.appendChild(s); }); }
function saveBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
async function downloadSelected(){
  const list=[...SEL].sort((a,b)=>a-b).map(i=>DATA[i]);
  if(list.length===1){ const a=document.createElement("a"); a.href=src(list[0]); a.download=fileName(list[0]); document.body.appendChild(a); a.click(); a.remove(); return; }
  toast("Preparing "+list.length+" photos…");
  try{
    await loadZip(); const zip=new JSZip(); const used={};
    for(const d of list){
      let name=fileName(d); if(used[name]){ used[name]++; name=name.replace(/\.jpg$/," ("+used[name]+").jpg"); } else used[name]=1;
      const r=await fetch(src(d)); if(!r.ok) continue; zip.file(name, await r.blob());
    }
    saveBlob(await zip.generateAsync({type:"blob"}),"Puff menu photos.zip"); toast("Downloaded "+list.length+" photos");
  }catch(e){ toast("Zip failed, downloading one at a time"); for(const d of list){ const a=document.createElement("a"); a.href=src(d); a.download=fileName(d); document.body.appendChild(a); a.click(); a.remove(); await new Promise(r=>setTimeout(r,400)); } }
}
function shootList(){
  const rows=[["Menu","Group","Section","Item","Diet","Description","Options","Status","Current photo"]];
  DATA.filter(d=>d.st!=="own"&&(MENU==="all"||d.m===MENU)).forEach(d=>rows.push([d.m,d.t,d.s,d.n,d.g,d.d,d.o,d.st==="none"?"No photo":"Stand-in (generic photo)",d.p]));
  const csv="﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  saveBlob(new Blob([csv],{type:"text/csv"}),"Puff menu shoot list.csv");
}
function toggleAudit(){ AUDIT=!AUDIT; AF="all"; document.querySelectorAll(".auditbar [data-a]").forEach(x=>x.classList.toggle("on",x.dataset.a==="all")); history.replaceState(null,"",AUDIT?"#audit":location.pathname+location.search); if(AUDIT) clearSel(); render(); }
document.querySelectorAll("#menuSeg button").forEach(b=>b.onclick=()=>{ MENU=b.dataset.v; document.querySelectorAll("#menuSeg button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
document.querySelectorAll(".auditbar [data-a]").forEach(b=>b.onclick=()=>{ AF=b.dataset.a; document.querySelectorAll(".auditbar [data-a]").forEach(x=>x.classList.toggle("on",x===b)); render(); });
render();
</script>
